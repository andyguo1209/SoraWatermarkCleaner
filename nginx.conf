worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Allow large file uploads (disable body size check)
    client_max_body_size 0;
    sendfile        on;
    keepalive_timeout  65;

    # Log to stdout/stderr so visible in docker logs
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 8080;

        # Streamlit Frontend
        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Streamlit healthcheck (optional)
        location /_stcore/health {
            proxy_pass http://127.0.0.1:8501/_stcore/health;
            proxy_set_header Host $host;
        }

        # Backend API
        # Maps /api/login -> http://127.0.0.1:8000/login
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
